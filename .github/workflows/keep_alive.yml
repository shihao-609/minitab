# Supabase 数据库 + Streamlit 应用保活定时任务
# 每 3 小时执行一次：
#   1. ping Supabase 数据库，防止免费版 7 天无活动被暂停
#   2. 访问 Streamlit 应用，防止应用休眠导致冷启动（打开慢）
name: Supabase Keep-Alive

on:
  schedule:
    # 每 3 小时执行一次 (UTC 时间)
    # 北京时间: 2:00, 5:00, 8:00, 11:00, 14:00, 17:00, 20:00, 23:00
    - cron: "0 */3 * * *"
  # 也支持手动触发
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests

      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python keep_alive.py

      - name: Wake up Streamlit app
        run: |
          # 访问 Streamlit 应用，防止社区版应用休眠（冷启动会导致打开慢）
          # 冷启动可能需 1~3 分钟，超时也没关系：请求本身已触发应用启动
          curl -s -o /dev/null -w "streamlit status: %{http_code}\n" \
            "https://minitab-nappfbsncsxtsc9gst2mjvx.streamlit.app/" \
            --max-time 180 || echo "streamlit wake triggered (cold start may still be running)"
